# set-hook -g session-created 'run-shell -b "if [ -d #{q:pane_current_path}/.devcontainer ] || [ -f #{q:pane_current_path}/devcontainer.json ]; then devcontainer up --workspace-folder #{q:pane_current_path} >/dev/null 2>&1; fi"'
# set-hook -g session-closed 'run-shell -b "session=#{q:hook_session_name}; for container in $(docker ps -aq --filter label=devcontainer.local_folder); do workspace=$(docker inspect --format=\047{{index .Config.Labels \"devcontainer.local_folder\"}}\047 \"\$container\"); if [ \"$(basename \"\$workspace\")\" = \"\$session\" ]; then docker rm -f \"\$container\" >/dev/null; fi; done"'
set -g extended-keys on
set -g extended-keys-format csi-u
